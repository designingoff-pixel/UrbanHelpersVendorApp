name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Generate Android project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Show build.gradle lines 1-30 (for diagnosis)
        run: head -30 android/build.gradle

      - name: Patch build.gradle — fix kotlinVersion in ext block
        run: |
          python3 - <<'EOF'
          import re

          with open('android/build.gradle', 'r') as f:
              content = f.read()

          print("=== ORIGINAL build.gradle ===")
          print(content[:2000])

          # Pattern 1: kotlinVersion = findProperty('android.kotlinVersion') ?: '...'
          content = re.sub(
              r"kotlinVersion\s*=\s*findProperty\(['\"]android\.kotlinVersion['\"]\)\s*\?:\s*['\"][^'\"]+['\"]",
              "kotlinVersion = '2.1.20'",
              content
          )

          # Pattern 2: kotlinVersion = findProperty('kotlinVersion') ?: '...'
          content = re.sub(
              r"kotlinVersion\s*=\s*findProperty\(['\"]kotlinVersion['\"]\)\s*\?:\s*['\"][^'\"]+['\"]",
              "kotlinVersion = '2.1.20'",
              content
          )

          # Pattern 3: kotlinVersion = '1.x.x' (hardcoded)
          content = re.sub(
              r"kotlinVersion\s*=\s*['\"]1\.[0-9]+\.[0-9]+['\"]",
              "kotlinVersion = '2.1.20'",
              content
          )

          # Pattern 4: if ext block doesn't define kotlinVersion at all, inject it
          if 'kotlinVersion' not in content:
              content = content.replace(
                  'ext {',
                  "ext {\n        kotlinVersion = '2.1.20'",
                  1
              )

          print("\n=== PATCHED build.gradle ===")
          print(content[:2000])

          with open('android/build.gradle', 'w') as f:
              f.write(content)

          print("\nPatch complete.")
          EOF

      - name: Show patched build.gradle lines 1-30
        run: head -30 android/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --warning-mode none
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanCaptain-Vendor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
