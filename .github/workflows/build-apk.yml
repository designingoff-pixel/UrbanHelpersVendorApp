name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Generate Android project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Pin Gradle wrapper to 8.10.2
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip|' \
            android/gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Patch gradle.properties for Kotlin compatibility
        run: |
          echo "" >> android/gradle.properties
          echo "# Kotlin/KSP compatibility" >> android/gradle.properties
          echo "android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings" >> android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4g -XX:MaxMetaspaceSize=512m"
          JAVA_OPTS: "-Xmx512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanCaptain-Vendor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
