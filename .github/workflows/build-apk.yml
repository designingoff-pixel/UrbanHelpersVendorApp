name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create .env file with Firebase config
        run: |
          cat > .env << 'EOF'
          EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyDhkD-wS-wCc2ZlMbHSNTEp3MFxSrLIUQY
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=urban-helpers-admin.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=urban-helpers-admin
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=urban-helpers-admin.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=843343743619
          EXPO_PUBLIC_FIREBASE_APP_ID=1:843343743619:web:a0c09ea15fa85780d6a9b6
          EOF

      - name: Install base dependencies
        run: npm install --legacy-peer-deps
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Install Expo-certified versions of native packages
        run: |
          npx expo install \
            react-native-screens \
            react-native-safe-area-context \
            expo-linear-gradient \
            expo-status-bar \
            @expo/vector-icons
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Generate Android project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Patch kotlinVersion in build.gradle
        run: |
          python3 - <<'EOF'
          import re

          with open('android/build.gradle', 'r') as f:
              content = f.read()

          patched = re.sub(
              r"(kotlinVersion\s*=\s*)(?:findProperty\(['\"][\w.]+['\"]\)\s*\?:\s*)?['\"][^'\"]*['\"]",
              r"\g<1>'2.1.20'",
              content
          )

          if 'kotlinVersion' not in patched:
              patched = patched.replace('ext {', "ext {\n        kotlinVersion = '2.1.20'", 1)

          with open('android/build.gradle', 'w') as f:
              f.write(patched)

          print("kotlinVersion patched to 2.1.20")
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Create assets directory for JS bundle
        run: mkdir -p android/app/src/main/assets

      - name: Bundle JavaScript (embed into APK)
        run: |
          npx expo export:embed \
            --platform android \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: 1

      - name: Verify bundle was created
        run: |
          ls -lh android/app/src/main/assets/
          echo "Bundle size: $(wc -c < android/app/src/main/assets/index.android.bundle) bytes"

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --warning-mode none
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanCaptain-Vendor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
