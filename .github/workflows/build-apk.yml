name: Build Android APK — Urban Captain Vendor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyDhkD-wS-wCc2ZlMbHSNTEp3MFxSrLIUQY
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=urban-helpers-admin.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=urban-helpers-admin
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=urban-helpers-admin.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=843343743619
          EXPO_PUBLIC_FIREBASE_APP_ID=1:843343743619:web:a0c09ea15fa85780d6a9b6
          EOF

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Force Kotlin 2.1.20 in build.gradle
        run: |
          # Show current content around kotlin version line
          grep -n -i kotlin android/build.gradle || true

          # Replace any kotlinVersion assignment (handles single quotes, double quotes, findProperty)
          python3 - << 'PYEOF'
          import re

          with open('android/build.gradle', 'r') as f:
              content = f.read()

          # Replace kotlinVersion however it's set
          content = re.sub(
              r'kotlinVersion\s*=\s*[^\n]+',
              'kotlinVersion = "2.1.20"',
              content
          )

          # If no kotlinVersion found at all, inject it
          if 'kotlinVersion' not in content:
              content = content.replace(
                  'buildscript {',
                  'buildscript {\n    ext.kotlinVersion = "2.1.20"',
                  1
              )

          with open('android/build.gradle', 'w') as f:
              f.write(content)

          print("Done. Kotlin version lines:")
          for i, line in enumerate(content.splitlines(), 1):
              if 'kotlin' in line.lower() and 'version' in line.lower():
                  print(f"  Line {i}: {line.strip()}")
          PYEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Create JS bundle directory
        run: mkdir -p android/app/src/main/assets

      - name: Bundle JS
        run: |
          npx expo export:embed \
            --platform android \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: '1'

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --warning-mode none \
            -Pkotlin.version=2.1.20
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.workers.max=2
            -Xmx4g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UrbanCaptain-Vendor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
