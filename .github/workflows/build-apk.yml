name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Generate Android project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Show generated Gradle wrapper version
        run: cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Patch gradle.properties — upgrade Kotlin to 2.1.20 for KSP compatibility
        run: |
          # Remove any existing kotlinVersion line then append the correct one
          sed -i '/^kotlinVersion/d' android/gradle.properties
          sed -i '/^kotlin.version/d' android/gradle.properties
          echo "kotlinVersion=2.1.20" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "--- gradle.properties ---"
          cat android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --warning-mode none
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanCaptain-Vendor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
