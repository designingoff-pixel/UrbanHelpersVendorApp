name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install base dependencies
        run: npm install --legacy-peer-deps
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Install Expo-certified versions of native packages
        run: |
          npx expo install \
            react-native-screens \
            react-native-safe-area-context \
            expo-linear-gradient \
            expo-status-bar \
            @expo/vector-icons
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Generate Android project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Patch kotlinVersion in build.gradle
        run: |
          python3 - <<'EOF'
          import re

          with open('android/build.gradle', 'r') as f:
              content = f.read()

          print("=== ORIGINAL lines 1-30 ===")
          for i, line in enumerate(content.splitlines()[:30], 1):
              print(f"{i}: {line}")

          # Replace any kotlinVersion assignment in the ext block
          patched = re.sub(
              r"(kotlinVersion\s*=\s*)(?:findProperty\(['\"][\w.]+['\"]\)\s*\?:\s*)?['\"][^'\"]*['\"]",
              r"\g<1>'2.1.20'",
              content
          )

          # If not found at all, inject into ext block
          if 'kotlinVersion' not in patched:
              patched = patched.replace('ext {', "ext {\n        kotlinVersion = '2.1.20'", 1)

          print("\n=== PATCHED lines 1-30 ===")
          for i, line in enumerate(patched.splitlines()[:30], 1):
              print(f"{i}: {line}")

          with open('android/build.gradle', 'w') as f:
              f.write(patched)

          print("\nDone.")
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --warning-mode none
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanCaptain-Vendor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
